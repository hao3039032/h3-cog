[project]
name = "h3-cog"
version = "0.1.0"
description = "MiniMax H3 text/image/first-last-frame video Cog for app.nz"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.4,<9"]
mirror = ["boto3>=1.40,<2", "huggingface-hub>=0.34,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
