image: "ghcr.io/lee101/h3-cog"
build:
  python_version: "3.12"
  gpu: true
  cuda: "12.8"
  system_packages:
    - "ffmpeg"
    - "git"
    - "curl"
    - "libgl1"
    - "libglib2.0-0"
  run:
    # Cog 0.21's uv-managed interpreter requires the explicit PEP 668 override.
    # This modifies only the isolated Python installation inside this image.
    - "python -m pip install --break-system-packages --extra-index-url https://download.pytorch.org/whl/cu128 torch==2.11.0 torchvision==0.26.0 torchaudio==2.11.0 requests==2.32.5 runpod==1.7.13 boto3==1.40.12"
    - "git clone https://github.com/Comfy-Org/ComfyUI.git /opt/ComfyUI && git -C /opt/ComfyUI checkout 9a9fdb10ed144ce760d9682cb247526ea23cc525"
    - "python -m pip install --break-system-packages --no-cache-dir -r /opt/ComfyUI/requirements.txt --extra-index-url https://download.pytorch.org/whl/cu128"
run: "predict.py:Runner"
