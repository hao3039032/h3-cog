image: "ghcr.io/lee101/h3-cog"
build:
  python_version: "3.12"
  gpu: true
  cuda: "12.8"
  system_packages:
    - "ffmpeg"
    - "git"
    - "curl"
    - "libgl1"
    - "libglib2.0-0"
  run:
    # Cog 0.21's uv-managed interpreter requires the explicit PEP 668 override.
    # This modifies only the isolated Python installation inside this image.
    # Keep CUDA wheels in registry-friendly layers. A single resolved PyTorch
    # install produces an 8GB layer that GHCR repeatedly terminates mid-upload.
    - "python -m pip install --break-system-packages --no-cache-dir --no-deps nvidia-cudnn-cu12==9.19.0.56"
    - "python -m pip install --break-system-packages --no-cache-dir --no-deps nvidia-cublas-cu12==12.8.4.1 nvidia-cusparselt-cu12==0.7.1"
    - "python -m pip install --break-system-packages --no-cache-dir --no-deps nvidia-nccl-cu12==2.28.9 nvidia-nvshmem-cu12==3.4.5"
    - "python -m pip install --break-system-packages --no-cache-dir --no-deps nvidia-cufft-cu12==11.3.3.83 nvidia-cusolver-cu12==11.7.3.90 nvidia-cusparse-cu12==12.5.8.93"
    - "python -m pip install --break-system-packages --no-cache-dir --no-deps nvidia-cuda-runtime-cu12==12.8.90 nvidia-cuda-cupti-cu12==12.8.90 nvidia-cufile-cu12==1.13.1.3 nvidia-curand-cu12==10.3.9.90 nvidia-nvjitlink-cu12==12.8.93 nvidia-cuda-nvrtc-cu12==12.8.93 nvidia-nvtx-cu12==12.8.90"
    - "python -m pip install --break-system-packages --extra-index-url https://download.pytorch.org/whl/cu128 torch==2.11.0 torchvision==0.26.0 torchaudio==2.11.0 requests==2.32.5 runpod==1.7.13"
    - "git clone https://github.com/Comfy-Org/ComfyUI.git /opt/ComfyUI && git -C /opt/ComfyUI checkout 43cb4fffc89bba20ab7bd61467a36d0339338dab"
    - "python -m pip install --break-system-packages --no-cache-dir -r /opt/ComfyUI/requirements.txt --extra-index-url https://download.pytorch.org/whl/cu128"
    - "TORCH_CUDA_ARCH_LIST='8.0;8.9;12.0' MAX_JOBS=4 python -m pip install --break-system-packages --no-cache-dir --no-build-isolation git+https://github.com/thu-ml/SageAttention.git@eb615cf6cf4d221338033340ee2de1c37fbdba4a"
run: "predict.py:Runner"
