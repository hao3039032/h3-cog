services:
  h3-gradio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SAGE_CUDA_ARCH_LIST: "${SAGE_CUDA_ARCH_LIST:-8.9;12.0}"
        MAX_JOBS: "${MAX_JOBS:-4}"
    image: "${H3_GRADIO_IMAGE:-h3-gradio:latest}"
    restart: unless-stopped
    shm_size: "8gb"
    ports:
      - "${H3_PORT:-7860}:${PORT:-7860}"
    environment:
      MINIMAX_H3_LICENSE_ACCEPTED: "${MINIMAX_H3_LICENSE_ACCEPTED:-}"
      H3_PARALLEL_MODE: "${H3_PARALLEL_MODE:-single}"
      H3_VIDEO_VAE_PRECISION: "${H3_VIDEO_VAE_PRECISION:-fp32}"
      H3_BAKED_WEIGHTS_VERIFIED: "${H3_BAKED_WEIGHTS_VERIFIED:-0}"
      H3_HIGHVRAM: "${H3_HIGHVRAM:-}"
      H3_LOWVRAM: "${H3_LOWVRAM:-}"
      H3_RESERVE_VRAM_GB: "${H3_RESERVE_VRAM_GB:-}"
      H3_SAGE_ATTENTION: "${H3_SAGE_ATTENTION:-}"
      GRADIO_PUBLIC_PORT: "${GRADIO_PUBLIC_PORT:-}"
      GRADIO_PUBLIC_PROTO: "${GRADIO_PUBLIC_PROTO:-}"
    volumes:
      - h3-gradio-tmp:/tmp
      - h3-weights:/weights
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  h3-gradio-tmp:

  h3-weights:
